project_id = "fox-plast"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

[storage]
enabled = true
file_size_limit = "5MiB"

[functions.create-order]
verify_jwt = true

# Telegram cannot send a Supabase JWT; the webhook secret header is the auth.
# Keep this false or /start and status buttons return 401.
[functions.telegram-webhook]
verify_jwt = false
